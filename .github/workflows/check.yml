name: Check

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpstan.neon'
      - '.php-cs-fixer.dist.php'
      - '.github/workflows/check.yml'

jobs:
  # フォーマット検査は PHP バージョンに依らないので 1 回だけ行う。
  # php-cs-fixer 3.89 は PHP 8.5 の構文をまだサポートしておらず、8.5 で実行すると
  # 「supports PHP syntax only up to PHP 8.4」と表示して検査せずに終了する (exit 0) ため、
  # matrix に乗せると偽の成功になる。php-cs-fixer が 8.5 をサポートしたら
  # php-version を上げる (この job を消す必要はない)。
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Run PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  checks:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon

      - name: Run PHPUnit
        run: vendor/bin/phpunit tests
